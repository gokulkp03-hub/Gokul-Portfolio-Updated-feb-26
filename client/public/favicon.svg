<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Monogram GK -->
  <g fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- G glyph -->
    <path d="M 215 180 C 195 155 155 155 130 180 C 98 212 98 300 130 332 C 158 360 200 358 222 332 C 232 320 236 304 236 272 L 175 272" />
    
    <!-- K glyph -->
    <path d="M 285 156 L 285 356" />
    <path d="M 380 165 L 288 262 L 375 356" />
  </g>

  <!-- Signature Accent Dot -->
  <circle cx="425" cy="350" r="20" fill="url(#orangeGrad)" filter="url(#glow)" />
</svg>