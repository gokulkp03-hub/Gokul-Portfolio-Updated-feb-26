services:
  - type: web
    name: gokul-portfolio
    env: node
    buildCommand: pnpm install && pnpm run db:push && pnpm run build
    startCommand: pnpm run start:server
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/sqlite.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: NODE_ENV
        value: production
      # Note: Make sure to set VITE_APP_LOGO, VITE_APP_TITLE, and JWT_SECRET in the Render dashboard
